<!DOCTYPE html>
<html>

<head>
    <style>
        .button {
            border: none;
            color: white;
            padding: 15px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition: backround-color 0.3s, transform 0, 3;
            cursor: pointer;
            border-radius: 5px;
        }

        .button-primary:hover {
            background-color: #0462CD;
        }

        .button-secondary:hover {
            background-color: #FA5E0A;
        }

        .button-danger:hover {
            background-color: #FAB60A;
        }

    </style>

</head>
<body>

    <h1>Ejemplo</h1>
<button class="button button-primary"> primary </button>
<button class="button button-primary"> primary hover</button>
<button class="button button-secondary"> secondary </button>
<button class="button button-secondary"> secondary hover </button>
<button class="button button-danger"> danger </button>
<button class="button button-danger"> danger hover </button>


</body>

</html>
