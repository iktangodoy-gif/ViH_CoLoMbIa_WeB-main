<DOCTYPE html>
<html>
<head>
    <style>
        .static{
            position: static
            background-color lightblue;
            padding: 10px;
        }
        .relative{
            position: relative;
            top: 10px;
            background-color: lightgreen;
            padding: 10px;
        }
        .absolute{
            position: absolute;
            top: 50px;
            left: 100px;
            background-color: lightcoral;
            padding: 10px;
        }
        .fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: lightgoldenrodyellow;
            padding: 10px;
        }
    </style>
</head>
<body>
    
<h2>Posicionamiento en CSS</h2>

<div class="static"> Posicionamiento Estatico</div>

<div class="relative"> Posicionamiento Relativo</div>

<div class="absolute">Posicionamiento Absoluto</div>

<div class="fixed">Posicionamiento Fijo</div>

<p style="margin-top: 150px;">
    Scroll down to see the sticky element.
</p>

<div class="sticky">Posicionamiento Sticky</div>

</p>
</body>
</html>
