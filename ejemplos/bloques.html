<!DOCTYPE html>
<html>
    <head> 
        <style>
            .block{
                display: block;
                width: 100%;
                background-color: lightblue;
                margin-bottom: 10px ;
            }
            .inline{
                display: inline;
                background-color: lightgreen;
            }
            .inline-block{
                display: inline-block;
                width: 100px;
                height: 100px;
               background-color: lightcoral;
               maring: 10px;
             }
             .flex-container{
                display: flex;
                background-color: lightgoldenrodyellow;
             }
             .flex-intem{
                background-color: lightgoldenrodyellow;
                padding: 20px;
                margin: 10px;
             }
             .grid-container{
                display: grid;
                grid-template-columns: auto auto auto;
                background-color: lavender;
             }
             .grid-item{
                background-color: lightsteelblue;
                padding: 20px;
                maring:10px;
             }
             
        </style>
    </head>
    <body>
        <div class="block">Bloque</div>
        <span class="inline">En linea</span>
        <div class="inline-block">En linea de Bloque</div>
        <div class="flex-container">
            <div class="flex-item">Flex 1</div>
            <div class="flex-intem">Flex 2</div>
            <div class="flex-intem">Flex 3</div>
            <div class="flex-intem">Flex 4</div>
        </div>
        <div class="grid-container">
            <div class="grid-item">Grid 1</div>
            <div class="grid-item">Grid 2</div>
            <div class="grid-item">Grid 3</div>
            <div class="grid-item">Grid 4</div>
        </div>
    </body>
</html>
